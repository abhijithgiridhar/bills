<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GFE Invoices</title>
<link rel="icon" href="assets/logo-gfe.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#55559a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Open+Sans:wght@400;500;600;700&family=Red+Hat+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot" class="boot">Loading…</div>
<div id="login" class="login" hidden>
  <div class="login-card">
    <img src="assets/logo-gfe.png" alt="Games for Ed" class="login-logo">
    <h1>Invoices</h1>
    <p>Internal tool for Plot Twist Games Studio LLP</p>
    <button id="btn-login" class="btn primary big">Sign in with Google</button>
    <p id="login-msg" class="muted small"></p>
  </div>
</div>
<div id="app" hidden>
  <header class="topbar">
    <div class="brandmark"><img src="assets/logo-gfe.png" alt=""><span>Invoices</span></div>
    <nav id="nav">
      <a href="#new" data-tab="new">New invoice</a>
      <a href="#history" data-tab="history">History</a>
      <a href="#pending" data-tab="pending">Pending <span id="pending-count" class="pill"></span></a>
      <a href="#dashboard" data-tab="dashboard">Dashboard</a>
      <a href="#admin" data-tab="admin">Admin</a>
    </nav>
    <a class="btn sm" id="proj-link" href="projects.html">Project costs →</a>
    <div class="who"><span id="who"></span> <button id="btn-logout" class="link">Sign out</button></div>
  </header>
  <div id="demo-banner" class="demo-banner" hidden>Demo mode: data is stored only in this browser. Nothing is sent to Supabase.</div>
  <main id="view"></main>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script>
  // Load the real Supabase layer, or the local demo layer with ?demo=1
  const demo = new URLSearchParams(location.search).has('demo');
  const libs = [
    'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  ];
  if (!demo) libs.unshift('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', 'config.js');
  libs.push(demo ? 'data-demo.js' : 'data.js', 'app.js');
  (function next(i) {
    if (i >= libs.length) return;
    const s = document.createElement('script'); s.src = libs[i];
    s.onload = () => next(i + 1);
    s.onerror = () => { document.getElementById('boot').textContent = 'Failed to load ' + libs[i]; };
    document.body.appendChild(s);
  })(0);
</script>
</body>
</html>
